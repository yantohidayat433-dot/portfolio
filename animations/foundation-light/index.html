<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foundation light</title>
<style>
  @font-face { font-family: 'PP Fragment Glare'; src: url(src/pp-fragment-glare-regular.woff2) format('woff2'); font-display: swap; }

  html, body { margin: 0; background: #1a1a1a; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }

  /* Frame: 1015x620, #0E0E0E. Everything inside is laid out in that design space
     and scaled to the frame's real width (--s). */
  .light {
    position: relative;
    width: min(1015px, 100%);
    aspect-ratio: 1015 / 620;
    background: #0E0E0E;
    overflow: hidden;
  }
  .light__stage {
    position: absolute; left: 0; top: 0;
    width: 1015px; height: 620px;
    transform: scale(var(--s, 1)); transform-origin: 0 0;
  }
  .light__stage > * { position: absolute; }

  /* The shape, placed exactly as on the approved slide (fitted to it:
     2724px wide, shifted and tilted -3.76deg, 82% opacity). */
  .light__shape {
    left: 0; top: 0; width: 2724.27px; height: 1618.2px;
    transform: translate(-738.65px, 97.05px) rotate(-3.762deg);
    transform-origin: 0 0;
  }
  .light__shape img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform-origin: 30% 32%;   /* the lit lump that shows in the frame */
    will-change: transform, opacity;
  }

  /* 1. The shape itself breathes: a clear drift, a few degrees of turn about the
        lit lump (so the long tail on the right rises and sinks and the light sweeps
        along the curve), a swell, and a slight skew that makes the edge undulate. */
  .light__shape--base img { opacity: .819; animation: base-drift 9s ease-in-out infinite alternate; }
  @keyframes base-drift {
    0%   { transform: translate(-16px, 12px) rotate(-2.6deg) skewX(-2deg) scale(1);    opacity: .72; }
    35%  { transform: translate(26px, -6px)  rotate(.8deg)   skewX(1.5deg) scale(1.045); opacity: .95; }
    70%  { transform: translate(40px, -18px) rotate(2.8deg)  skewX(-1deg)  scale(1.06);  opacity: .88; }
    100% { transform: translate(-4px, 4px)   rotate(-.6deg)  skewX(2deg)   scale(1.02);  opacity: .8; }
  }

  /* 2. A second copy blended as light, on its own period: it flares up and spreads
        (growing about the lump, so its edge stays near the base edge rather than
        floating above it, where the faint yellow fringe would turn olive), then
        sinks back. Leaned orange so it reads as warm light. */
  .light__shape--spill { mix-blend-mode: screen; }
  .light__shape--spill img { opacity: 0; filter: saturate(1.25) hue-rotate(-10deg); animation: spill 11s ease-in-out infinite; }
  @keyframes spill {
    0%, 100% { transform: translate(-10px, 10px) rotate(-1deg) scale(.99);  opacity: 0; }
    40%      { transform: translate(12px, -6px)  rotate(1.4deg) scale(1.05); opacity: .55; }
    60%      { transform: translate(18px, -8px)  rotate(2deg)   scale(1.07); opacity: .45; }
  }

  .light__text {
    left: 0; right: 0; top: 0; bottom: 0;
    display: grid; place-items: center;
    margin: 0;
    color: #fff;
    font-family: 'PP Fragment Glare', serif;
    font-size: 20px; line-height: .98; letter-spacing: .06em;
    text-transform: uppercase; white-space: nowrap;
    mix-blend-mode: difference;
  }

  @media (prefers-reduced-motion: reduce) {
    .light__shape img { animation: none; }
  }
</style>
</head>
<body>

<div class="light" data-light role="img" aria-label="We light the way toward humanity's greatest discoveries">
  <div class="light__stage">
    <div class="light__shape light__shape--base"><img src="src/shape-1000.webp" alt="" /></div>
    <div class="light__shape light__shape--spill"><img src="src/shape-1000.webp" alt="" /></div>
    <p class="light__text">We light the way toward humanity's greatest discoveries</p>
  </div>
</div>

<script>
(function () {
  document.querySelectorAll('[data-light]').forEach(function (root) {
    var stage = root.querySelector('.light__stage');
    function fit() { stage.style.setProperty('--s', root.clientWidth / 1015); }
    fit();
    if ('ResizeObserver' in window) new ResizeObserver(fit).observe(root);
    else window.addEventListener('resize', fit);
  });
})();
</script>
</body>
</html>
