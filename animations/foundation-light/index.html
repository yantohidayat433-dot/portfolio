<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foundation light</title>
<style>
  @font-face { font-family: 'PP Fragment Glare'; src: url(src/pp-fragment-glare-regular.woff2) format('woff2'); font-display: swap; }

  html, body { margin: 0; background: #1a1a1a; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }

  /* Frame: 1015x620, #0E0E0E. Everything inside is laid out in that design space
     and scaled to the frame's real width (--s). */
  .light {
    position: relative;
    width: min(1015px, 100%);
    aspect-ratio: 1015 / 620;
    background: #0E0E0E;
    overflow: hidden;
  }
  .light__stage {
    position: absolute; left: 0; top: 0;
    width: 1015px; height: 620px;
    transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--s, 1)); transform-origin: 0 0;
  }
  .light__stage > * { position: absolute; }

  /* The shape, placed exactly as on the approved slide (fitted to it:
     2724px wide, shifted and tilted -3.76deg, 82% opacity). */
  .light__shape {
    left: 0; top: 0; width: 2724.27px; height: 1618.2px;
    transform: translate(-738.65px, 97.05px) rotate(-3.762deg);
    transform-origin: 0 0;
  }
  .light__shape img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform-origin: 30% 32%;   /* the lit lump that shows in the frame */
    will-change: transform, opacity;
  }

  /* 1. The shape itself breathes: a clear drift, a few degrees of turn about the
        lit lump (so the long tail on the right rises and sinks and the light sweeps
        along the curve), a swell, and a slight skew that makes the edge undulate. */
  .light__shape--base img { opacity: .819; animation: base-drift 7s ease-in-out infinite alternate; }
  @keyframes base-drift {
    0%   { transform: translate(-16px, 12px) rotate(-2.6deg) skewX(-2deg) scale(1);    opacity: .72; }
    35%  { transform: translate(26px, -6px)  rotate(.8deg)   skewX(1.5deg) scale(1.045); opacity: .95; }
    70%  { transform: translate(40px, -18px) rotate(2.8deg)  skewX(-1deg)  scale(1.06);  opacity: .88; }
    100% { transform: translate(-4px, 4px)   rotate(-.6deg)  skewX(2deg)   scale(1.02);  opacity: .8; }
  }

  /* 2. A second copy blended as light, on its own period: it flares up and spreads
        (growing about the lump, so its edge stays near the base edge rather than
        floating above it, where the faint yellow fringe would turn olive), then
        sinks back. Leaned orange so it reads as warm light. */
  .light__shape--spill { mix-blend-mode: screen; }
  .light__shape--spill img { opacity: 0; filter: saturate(1.25) hue-rotate(-10deg); animation: spill 8.5s ease-in-out infinite; }
  @keyframes spill {
    0%, 100% { transform: translate(-10px, 10px) rotate(-1deg) scale(.99);  opacity: 0; }
    40%      { transform: translate(12px, -6px)  rotate(1.4deg) scale(1.05); opacity: .62; }
    60%      { transform: translate(18px, -8px)  rotate(2deg)   scale(1.07); opacity: .45; }
  }

  /* 3. A glint sweeping left to right across the glow. It is an exact copy of the
        base shape (same placement, same drift, so no fringe can stray above the
        edge), seen only through a soft vertical band that travels across the
        frame. The band moves on the outer box while the inner box counter-moves,
        so the shape itself stays put and only the window slides. */
  .light__sweep {
    left: 0; top: 0; width: 1100px; height: 620px;
    mix-blend-mode: plus-lighter; /* additive: lifts the dim tail too, not just the bright lump */
    /* Bell-shaped window (Gaussian stops): no flat top and no straight edges,
       so the passing light has no visible boundaries. */
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.006) 0%, rgba(0,0,0,0.015) 5%, rgba(0,0,0,0.037) 10%, rgba(0,0,0,0.080) 15%, rgba(0,0,0,0.156) 20%, rgba(0,0,0,0.275) 25%, rgba(0,0,0,0.438) 30%, rgba(0,0,0,0.628) 35%, rgba(0,0,0,0.813) 40%, rgba(0,0,0,0.950) 45%, rgba(0,0,0,1.000) 50%, rgba(0,0,0,0.950) 55%, rgba(0,0,0,0.813) 60%, rgba(0,0,0,0.628) 65%, rgba(0,0,0,0.438) 70%, rgba(0,0,0,0.275) 75%, rgba(0,0,0,0.156) 80%, rgba(0,0,0,0.080) 85%, rgba(0,0,0,0.037) 90%, rgba(0,0,0,0.015) 95%, rgba(0,0,0,0.006) 100%);
            mask-image: linear-gradient(90deg, rgba(0,0,0,0.006) 0%, rgba(0,0,0,0.015) 5%, rgba(0,0,0,0.037) 10%, rgba(0,0,0,0.080) 15%, rgba(0,0,0,0.156) 20%, rgba(0,0,0,0.275) 25%, rgba(0,0,0,0.438) 30%, rgba(0,0,0,0.628) 35%, rgba(0,0,0,0.813) 40%, rgba(0,0,0,0.950) 45%, rgba(0,0,0,1.000) 50%, rgba(0,0,0,0.950) 55%, rgba(0,0,0,0.813) 60%, rgba(0,0,0,0.628) 65%, rgba(0,0,0,0.438) 70%, rgba(0,0,0,0.275) 75%, rgba(0,0,0,0.156) 80%, rgba(0,0,0,0.080) 85%, rgba(0,0,0,0.037) 90%, rgba(0,0,0,0.015) 95%, rgba(0,0,0,0.006) 100%);
    will-change: transform;
    animation: sweep 12s cubic-bezier(.45, 0, .55, 1) infinite;
  }
  .light__sweep-inner { position: absolute; left: 0; top: 0; width: 1015px; height: 620px; will-change: transform;
    /* Held still in the frame (it counter-moves), so this mask is fixed: the glint is
       damped over the already-bright corner, where adding light blew it out to white. */
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(0,0,0,.3) 120px, rgba(0,0,0,.65) 300px, #000 520px);
            mask-image: linear-gradient(90deg, rgba(0,0,0,.3) 0, rgba(0,0,0,.3) 120px, rgba(0,0,0,.65) 300px, #000 520px); animation: sweep-counter 12s cubic-bezier(.45, 0, .55, 1) infinite; }
  .light__sweep-inner .light__shape { position: absolute; }
  .light__sweep-inner img { filter: brightness(1.4) saturate(1.3) hue-rotate(-8deg); opacity: .85; animation: base-drift 7s ease-in-out infinite alternate; }
  @keyframes sweep {
    0%        { transform: translateX(-1100px); }
    75%, 100% { transform: translateX(1015px); }
  }
  @keyframes sweep-counter {
    0%        { transform: translateX(1100px); }
    75%, 100% { transform: translateX(-1015px); }
  }

  .light__text {
    left: 0; right: 0; top: 0; bottom: 0;
    display: grid; place-items: center;
    margin: 0;
    color: #fff;
    font-family: 'PP Fragment Glare', serif;
    font-size: 20px; line-height: .98; letter-spacing: .06em;
    text-transform: uppercase; white-space: nowrap;
    mix-blend-mode: difference;
    /* Optical centring, measured on the rendered caps: tracking also adds space
       after the last letter, and the line box isn't centred on cap height. */
    transform: translate(1px, .5px);
  }

  @media (prefers-reduced-motion: reduce) {
    .light__shape img, .light__sweep, .light__sweep-inner { animation: none; }
    .light__sweep { display: none; }
  }
</style>
</head>
<body>

<div class="light" data-light role="img" aria-label="We light the way toward humanity's greatest discoveries">
  <div class="light__stage">
    <div class="light__shape light__shape--base"><img src="src/shape-1000.webp" alt="" /></div>
    <div class="light__shape light__shape--spill"><img src="src/shape-1000.webp" alt="" /></div>
    <div class="light__sweep"><div class="light__sweep-inner"><div class="light__shape"><img src="src/shape-1000.webp" alt="" /></div></div></div>
    <p class="light__text">We light the way toward humanity's greatest discoveries</p>
  </div>
</div>

<script>
(function () {
  document.querySelectorAll('[data-light]').forEach(function (root) {
    var stage = root.querySelector('.light__stage');
    // Cover the frame like the image this replaced (object-fit: cover): the case slot
    // keeps a fixed 620px height while its width shrinks with the window, so scaling
    // by width alone left the stage short of the bottom edge.
    function fit() {
      var w = root.clientWidth, h = root.clientHeight;
      var s = Math.max(w / 1015, h / 620);
      stage.style.setProperty('--s', s);
      stage.style.setProperty('--tx', (w - 1015 * s) / 2 + 'px');
      stage.style.setProperty('--ty', (h - 620 * s) / 2 + 'px');
    }
    fit();
    if ('ResizeObserver' in window) new ResizeObserver(fit).observe(root);
    else window.addEventListener('resize', fit);
  });
})();
</script>
</body>
</html>
