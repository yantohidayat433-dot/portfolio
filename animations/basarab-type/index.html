<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Basarab type</title>
<!--
  Basarab post, 1080x1350. The client's two mockups (ref/mock-text.webp,
  ref/mock-site.webp) are the start and end frames: the three-line copy
  breathes via letter-spacing waves, then the lines fold toward their centres as they fade
  and "basarab.com" opens out of the middle with wide tracking and tightens; then back.
  Photos sit exactly where they are in the mockups (top y=0, bottom y=767).
  Glyphs are SVG <text> at measured baselines, one element per letter.
  ?t=SECONDS freezes a frame (render.js); otherwise it loops in real time.
-->
<style>
  @font-face { font-family: 'PP Right Grotesk'; src: url('src/PPRightGrotesk-Bold.otf'); font-weight: 700; }
  html, body { margin: 0; background: #fff; }
  .post { position: relative; width: 1080px; height: 1350px; background: #fff; overflow: hidden; }
  .post > img { position: absolute; left: 0; width: 1080px; display: block; }
  .top { top: 0; }
  .bottom { top: 767px; }
  svg.type { position: absolute; inset: 0; width: 1080px; height: 1350px; overflow: visible; }
  svg.type text, .probe { font-family: 'PP Right Grotesk'; font-weight: 700; font-feature-settings: 'ss01'; }
  svg.type text { fill: #08090D; }
  .probe { position: absolute; left: 0; top: 0; font-size: 100px; white-space: pre; visibility: hidden; }
</style>
</head>
<body>
<div class="post">
  <img class="top" src="src/top.png" alt="" />
  <img class="bottom" src="src/bottom.png" alt="" />
  <svg class="type" viewBox="0 0 1080 1350"></svg>
</div>
<script>
// ---- layout, measured against the mockups --------------------------------
const FONT = "700 100px 'PP Right Grotesk'";
const CX = 540;
const COPY = { size: 32, track: 6.9, baselines: [649, 685, 721],
  lines: ['A flexible, flat sole, anatomical toe,', 'and soft upper let the foot move', 'naturally'] };
const SITE = { size: 33.3, track: 6.4, baseline: 686, text: 'basarab.com' };

// ---- timeline (s) ----------------------------------------------------------
// letter-spacing waves (the first approved version): a swell runs along each
// line in 0.5s, each line on its own phase so they breathe out of step
const T_BREATHE = 0.8;
const WAVE = [
  { at: 0.0, dur: 2.2, amp: 6.0, dir: 1 },
  { at: 0.45, dur: 2.3, amp: 9.5, dir: -1 },
  { at: 0.9, dur: 2.4, amp: 62, dir: 1 },
];
const T_GATHER = 4.7, GATHER = 2.6;        // copy -> basarab.com
const HOLD = 1.5;                          // basarab.com at rest
const T_SCATTER = T_GATHER + GATHER + HOLD, SCATTER = GATHER;   // basarab.com -> copy (gather reversed)
const DURATION = T_SCATTER + SCATTER + 0.3;
window.DURATION = DURATION;
const SPREAD = 1.35;  // how far basarab.com opens up before settling (x its width)
const FOLD = 0.45;    // how far the copy folds toward its centre while it fades

const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, p) => a + (b - a) * p;
const sine = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));

// single-storey "a" is ss01, which canvas can't measure: use a hidden span
const probe = Object.assign(document.createElement('span'), { className: 'probe' });
document.body.appendChild(probe);
const svg = document.querySelector('svg.type');
const NS = 'http://www.w3.org/2000/svg';

let glyphs = [], site = [], siteG, revealRect;
const el = (tag, parent, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
};

function build() {
  // x of each letter (with kerning) and total advance, in em
  const metrics = (s) => {
    probe.textContent = s;
    const node = probe.firstChild, x0 = probe.getBoundingClientRect().left, r = document.createRange();
    const box = [...s].map((_, i) => { r.setStart(node, i); r.setEnd(node, i + 1); const b = r.getBoundingClientRect(); return [(b.left - x0) / 100, b.width / 100]; });
    return { box, w: probe.getBoundingClientRect().width / 100 };
  };

  glyphs = COPY.lines.map((line, li) => {
    const { box, w } = metrics(line);
    return [...line].map((ch, i) => {
      const t = el('text', svg, { y: COPY.baselines[li], 'font-size': COPY.size }); t.textContent = ch;
      return { el: t, n: line.length, pre: box[i][0], adv: box[i][1], w };
    });
  });

  const { box, w } = metrics(SITE.text);
  const sw = w * SITE.size + (SITE.text.length - 1) * SITE.track;
  // basarab.com sits under a soft-edged window that opens from the centre
  const defs = el('defs', svg);
  const grad = el('linearGradient', defs, { id: 'reveal-fade' });
  [[0, 0], [0.3, 1], [0.7, 1], [1, 0]].forEach(([o, a]) => el('stop', grad, { offset: o, 'stop-color': '#fff', 'stop-opacity': a }));
  const mask = el('mask', defs, { id: 'reveal', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 1080, height: 1350 });
  revealRect = el('rect', mask, { y: SITE.baseline - SITE.size, height: SITE.size * 1.6, fill: 'url(#reveal-fade)' });
  siteG = el('g', svg, { mask: 'url(#reveal)' });
  site = [...SITE.text].map((ch, k) => {
    const t = el('text', siteG, { y: SITE.baseline, 'font-size': SITE.size, 'text-anchor': 'middle' }); t.textContent = ch;
    return { el: t, cx: CX - sw / 2 + (box[k][0] + box[k][1] / 2) * SITE.size + k * SITE.track };
  });
}

const bell = (x) => (x <= 0 || x >= 1) ? 0 : Math.pow(Math.sin(Math.PI * x), 2);
// extra letter-spacing after gap i of line li at time t
function extra(li, i, n, t) {
  const w = WAVE[li];
  const pos = n > 2 ? i / (n - 2) : 0;                 // 0..1 along the line
  const lag = (w.dir > 0 ? pos : 1 - pos) * 0.5;       // wave travels across in 0.5s
  return w.amp * bell((t - T_BREATHE - w.at - lag) / w.dur);
}

window.setTime = (t) => {
  t = ((t % DURATION) + DURATION) % DURATION;
  // transition progress: 0 = copy, 1 = basarab.com
  const p = clamp(t < T_SCATTER ? (t - T_GATHER) / GATHER : 1 - (t - T_SCATTER) / SCATTER);

  // 1) every line drifts toward its centre and dissolves before letters can pile up
  glyphs.forEach((line, li) => {
    const n = line.length, gaps = [];
    for (let i = 0; i < n - 1; i++) gaps.push(COPY.track + extra(li, i, n, t));
    const w = line[0].w * COPY.size + gaps.reduce((a, b) => a + b, 0);
    const k = ease((p - li * 0.04) / 0.42);
    let acc = 0;
    line.forEach((g, i) => {
      const cx = CX - w / 2 + (g.pre + g.adv / 2) * COPY.size + acc;
      if (i < n - 1) acc += gaps[i];
      // outer letters fade a touch earlier, so the line thins from its ends
      const d = Math.abs(cx - CX) / (w / 2);
      g.el.setAttribute('x', (lerp(cx, CX, FOLD * k) - g.adv / 2 * COPY.size).toFixed(2));
      g.el.style.opacity = 1 - clamp((k - 0.25 * (1 - d)) / 0.6);
    });
  });

  // 2) basarab.com opens out of the centre: a soft window widens while the
  // tracking swells past its final width and settles; all stages sine-eased
  const q = clamp((p - 0.3) / 0.7);
  const sp = q < 0.6 ? lerp(0.8, SPREAD, sine(q / 0.6)) : lerp(SPREAD, 1, sine((q - 0.6) / 0.4));
  site.forEach((g) => g.el.setAttribute('x', lerp(CX, g.cx, sp).toFixed(2)));
  // window's opaque core (middle 40%) reaches past the outer letters once open
  const half = (site[site.length - 1].cx - CX) * sp + SITE.size;
  const mw = (2 * half / 0.4) * sine(q / 0.65);
  revealRect.setAttribute('x', (CX - mw / 2).toFixed(2));
  revealRect.setAttribute('width', Math.max(0, mw).toFixed(2));
  siteG.style.opacity = sine(q / 0.25);
};

window.ready = (async () => {
  await document.fonts.load(FONT);
  build();
  const fixed = new URLSearchParams(location.search).get('t');
  if (fixed !== null) setTime(parseFloat(fixed));
  else { const t0 = performance.now(); const loop = (now) => { setTime((now - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
