<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Basarab logo</title>
<!--
  Basarab logo post, 1080x1350, after the client's "Marie Antoinette" reference,
  her five keyframes (ref/frame-1..5.svg) and her brief:
  1  the wordmark slides in on dark and lands on frame 1: fill #10121A,
     1px outside outline #3D404D, 12px #8A8D99 squares on every path node
     (as in ref/points.png);
  2  a quick-start, long-settle camera move to the S, a quick push-in on its
     top tail while the tail cuts ease from flat (src/logotype-flat-s.svg) to
     the final slanted ones, and back out;
  3  the same move on to the R while a light panel wipes in, letters solid;
  4  pull back to the small full wordmark (frame 4);
  5  the A's fold away and B S R B close up into the monogram, cut to dark
     (frame 5); then it cuts back to 1.
  Camera moves are measured from the reference: still, a ~0.1s surge, then a
  long ease-out. ?t=SECONDS freezes a frame (render.js).
-->
<style>
  html, body { margin: 0; background: #08090D; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="post" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
<script>
// ---- colours -----------------------------------------------------------------
const DARK = '#08090D', LIGHT = '#EAE9F0';
const DARK_FILL = '#10121A', DARK_LINE = '#3D404D', DOT_FILL = '#8A8D99';
const LIGHT_FILL = '#111111', LIGHT_LINE = '#626262';   // frame 3
const SMALL_FILL = '#08090D';                           // frame 4
const MONO_FILL = '#EAE9F0';                            // frame 5
const DOT = 12;                                         // node square, px

// ---- camera (logo units -> screen: x*s + tx, y*s + ty) -------------------------
const BIG_TY = 179;                          // frames 1-3, logo at 1:1
const X1 = 182;                              // frame 1
const ENTER = 820;                           // slides in from this far right
const SMALL = { s: 415 / 3493, tx: 333, ty: 616 };   // frame 4

// ---- timeline (s), paced after the reference (measured frame by frame):
// short holds, ~0.85s and ~0.65s camera moves, a ~0.4s pull-back ----------------
const T_IN = 0, IN = 0.55;
const T_S = T_IN + IN + 0.3, MOVE_S = 0.85;        // move to the S
const T_ZIN = T_S + MOVE_S * 0.85, ZIN = 0.4;     // quick push-in on the S's top tail
const TAIL = { x: 1340, y: 290, s: 3.2 };          // tail point (logo units) and close-up scale
const T_MORPH = T_ZIN + ZIN * 0.9, MORPH = 0.6;    // the cut slants while we're close
const T_ZOUT = T_MORPH + MORPH + 0.15, ZOUT = 0.4; // back out to the S
const T_R = T_ZOUT + ZOUT, MOVE_R = 0.65;          // move to the R, light panel wipes in
const T_ZOOM = T_R + MOVE_R + 0.4, ZOOM = 0.4;
const T_FOLD = T_ZOOM + ZOOM + 0.9, FOLD = 0.45;
const T_CUT = T_FOLD + FOLD * 0.55;                // background flips mid-close, like the reference
const DURATION = T_FOLD + FOLD + 1.2;
window.DURATION = DURATION;

const clamp = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = (x) => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const sine = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
// cubic-bezier(x1, y1, x2, y2) like CSS
const bezier = (x1, y1, x2, y2) => (x) => {
  x = clamp(x);
  const B = (a, b, t) => 3 * a * (1 - t) ** 2 * t + 3 * b * (1 - t) * t * t + t ** 3;
  let lo = 0, hi = 1, t = x;
  for (let i = 0; i < 40; i++) { t = (lo + hi) / 2; if (B(x1, x2, t) < x) lo = t; else hi = t; }
  return B(y1, y2, t);
};
const surge = bezier(0.45, 0, 0.15, 1);     // still -> quick surge -> long settle
const settle = bezier(0.15, 0.6, 0.3, 1);   // the entry: arrives fast, lands softly
const pull = bezier(0.65, 0, 0.25, 1);      // pull-back: gathers speed, lands gently
const mix = (a, b, p) => {
  const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const A = h(a), B = h(b);
  return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',') + ')';
};

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, parent, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
};
const svg = document.getElementById('post');

// absolute M/L/H/V/C/Z path (what Figma exports) -> segments with explicit
// coordinates, H/V written out as L, so two versions can be interpolated
function segments(d) {
  const tok = d.match(/[MLHVCZ]|-?\d*\.?\d+(?:e-?\d+)?/gi);
  const segs = []; let cmd = '', x = 0, y = 0, i = 0;
  const num = () => parseFloat(tok[i++]);
  while (i < tok.length) {
    if (/[A-Z]/i.test(tok[i])) cmd = tok[i++].toUpperCase();
    if (cmd === 'Z') { segs.push(['Z']); continue; }
    if (cmd === 'M' || cmd === 'L') { x = num(); y = num(); segs.push([cmd, x, y]); }
    else if (cmd === 'H') { x = num(); segs.push(['L', x, y]); }
    else if (cmd === 'V') { y = num(); segs.push(['L', x, y]); }
    else if (cmd === 'C') { const c = [num(), num(), num(), num()]; x = num(); y = num(); segs.push(['C', ...c, x, y]); }
  }
  return segs;
}
const toD = (segs) => segs.map((s) => s[0] + s.slice(1).map((v) => v.toFixed(3)).join(' ')).join('');
const lerpSegs = (a, b, p) => a.map((s, i) => [s[0], ...s.slice(1).map((v, j) => lerp(v, b[i][j + 1], p))]);
// path nodes: every segment end, minus the closing repeat of the start point
function nodes(segs) {
  const pts = [];
  let start = null;
  for (const s of segs) {
    if (s[0] === 'Z') { start = null; continue; }
    const p = [s[s.length - 2], s[s.length - 1]];
    if (s[0] === 'M') start = p;
    else if (start && Math.hypot(p[0] - start[0], p[1] - start[1]) < 0.5) continue;
    pts.push(p);
  }
  return pts;
}

let S = {};
async function build() {
  const parse = async (url) => [...new DOMParser().parseFromString(await (await fetch(url)).text(), 'image/svg+xml')
    .querySelectorAll('path[d]')].map((p) => p.getAttribute('d'));
  const letters = await parse('src/logotype.svg');            // B A S A R A B (final)
  const flatS = segments((await parse('src/logotype-flat-s.svg'))[2]);
  const finalS = segments(letters[2]);
  const mono = await parse('ref/frame-5.svg');                 // B S R B, final place

  const bg = el('rect', svg, { width: 1080, height: 1350, fill: DARK });
  const panel = el('rect', svg, { y: 0, height: 1350, fill: LIGHT });
  const defs = el('defs', svg);
  const clipDark = el('rect', el('clipPath', defs, { id: 'dark' }), { x: 0, y: 0, height: 1350 });
  const clipLight = el('rect', el('clipPath', defs, { id: 'light' }), { y: 0, height: 1350 });

  // dark look: 2px centred outline painted under the fill = 1px outside
  const darkG = el('g', el('g', svg, { 'clip-path': 'url(#dark)' }));
  const darkPaths = letters.map((d) => el('path', darkG, { d, fill: DARK_FILL, stroke: DARK_LINE, 'paint-order': 'stroke' }));
  const dotsG = el('g', svg, { 'clip-path': 'url(#dark)', fill: DOT_FILL });
  const segs = letters.map(segments);
  const ptsOf = (li, sg) => nodes(sg).map((p) => ({ li, p }));
  const dots = letters.flatMap((_, li) => ptsOf(li, segs[li]).map(() => el('rect', dotsG, { width: DOT, height: DOT })));

  // light look, one path per letter so the A's can fold away
  const lightG = el('g', svg, { 'clip-path': 'url(#light)' });
  const lightPaths = letters.map((d) => el('path', lightG, { d, stroke: LIGHT_LINE, 'paint-order': 'stroke' }));

  const box = (d) => { const p = el('path', svg, { d }); const b = p.getBBox(); p.remove(); return b; };
  const lb = letters.map(box), mb = mono.map(box);
  const target = {};
  [0, 2, 4, 6].forEach((li, k) => {
    const s = mb[k].height / lb[li].height;
    target[li] = { s, tx: mb[k].x - lb[li].x * s, ty: mb[k].y - lb[li].y * s };
  });
  const centre = (li) => lb[li].x + lb[li].width / 2;
  S = { bg, panel, clipDark, clipLight, darkG, darkPaths, dots, segs, flatS, finalS, lightPaths, lb, target,
        XS: 540 - centre(2), XR: 540 - centre(4) };
}

// horizontal camera position on the 1:1 logo
function panX(t) {
  if (t < T_S) return lerp(X1 + ENTER, X1, settle((t - T_IN) / IN));
  if (t < T_R) return lerp(X1, S.XS, surge((t - T_S) / MOVE_S));   // (camera() takes over from T_ZIN)
  return lerp(S.XS, S.XR, surge((t - T_R) / MOVE_R));
}

// zoom from camera A to camera B as one straight scale about their fixed
// point, so the picture grows/shrinks in place instead of drifting
function zoomCam(A, B, p) {
  const k = B.s / A.s, kp = Math.pow(k, p);
  const fx = (B.tx - k * A.tx) / (1 - k), fy = (B.ty - k * A.ty) / (1 - k);
  return { s: A.s * kp, tx: fx + (A.tx - fx) * kp, ty: fy + (A.ty - fy) * kp };
}

function camera(t) {
  if (t >= T_ZIN && t < T_R) {
    const A = { s: 1, tx: panX(T_ZIN), ty: BIG_TY };
    const B = { s: TAIL.s, tx: 540 - TAIL.x * TAIL.s, ty: 675 - TAIL.y * TAIL.s };
    const p = t < T_ZOUT ? pull((t - T_ZIN) / ZIN) : 1 - pull((t - T_ZOUT) / ZOUT);
    return zoomCam(A, B, p);
  }
  if (t < T_ZOOM) return { s: 1, tx: panX(t), ty: BIG_TY };
  return zoomCam({ s: 1, tx: S.XR, ty: BIG_TY }, SMALL, pull((t - T_ZOOM) / ZOOM));
}

window.setTime = (t) => {
  t = ((t % DURATION) + DURATION) % DURATION;
  const cam = camera(t);
  const m = `matrix(${cam.s} 0 0 ${cam.s} ${cam.tx} ${cam.ty})`;

  // S tails: flat cuts until the camera has settled on the S, then they slant
  const sSegs = lerpSegs(S.flatS, S.finalS, ease((t - T_MORPH) / MORPH));
  const sD = toD(sSegs);
  S.segs[2] = sSegs;

  // light panel wipes in from the right during the move to the R
  const w = clamp((t - T_R - MOVE_R * 0.12) / (MOVE_R * 0.55));
  const edge = 1080 * (1 - ease(w));
  S.panel.setAttribute('x', edge); S.panel.setAttribute('width', 1080 - edge);
  S.clipDark.setAttribute('width', edge);
  S.clipLight.setAttribute('x', edge); S.clipLight.setAttribute('width', 1080 - edge);

  S.darkG.setAttribute('transform', m);
  S.darkPaths.forEach((p, li) => {
    p.setAttribute('stroke-width', 2 / cam.s);
    if (li === 2) p.setAttribute('d', sD);
  });
  let k = 0;
  const showDots = edge > 0;
  S.segs.forEach((sg) => nodes(sg).forEach(([x, y]) => {
    const r = S.dots[k++];
    r.style.display = showDots ? '' : 'none';
    if (!showDots) return;
    r.setAttribute('x', (x * cam.s + cam.tx - DOT / 2).toFixed(2));
    r.setAttribute('y', (y * cam.s + cam.ty - DOT / 2).toFixed(2));
  }));

  const zp = clamp((t - T_ZOOM) / ZOOM);
  const f = ease((t - T_FOLD) / FOLD);
  const cut = t >= T_CUT;
  S.panel.style.display = cut || edge >= 1080 ? 'none' : '';
  const at = (li, T) => (S.lb[li].x + S.lb[li].width / 2) * lerp(cam.s, T.s, f) + lerp(cam.tx, T.tx, f);
  S.lightPaths.forEach((p, li) => {
    if (li === 2) p.setAttribute('d', sD);
    const T = S.target[li];
    if (t >= T_FOLD && !T) {
      // an A folds shut around its centre, kept midway between its neighbours
      const a = ease((t - T_FOLD) / (FOLD * 0.6));
      const mid = (at(li - 1, S.target[li - 1]) + at(li + 1, S.target[li + 1])) / 2;
      const tx = mid - (S.lb[li].x + S.lb[li].width / 2) * cam.s;
      p.setAttribute('transform', `translate(${mid} 0) scale(${1 - a} 1) translate(${-mid} 0) matrix(${cam.s} 0 0 ${cam.s} ${tx} ${cam.ty})`);
      p.style.opacity = 1 - a;
      p.setAttribute('fill', SMALL_FILL); p.setAttribute('stroke-width', 0);
      return;
    }
    let s = cam.s, tx = cam.tx, ty = cam.ty;
    if (t >= T_FOLD) { s = lerp(cam.s, T.s, f); tx = lerp(cam.tx, T.tx, f); ty = lerp(cam.ty, T.ty, f); }
    p.setAttribute('transform', `matrix(${s} 0 0 ${s} ${tx} ${ty})`);
    p.style.opacity = 1;
    p.setAttribute('fill', cut ? MONO_FILL : mix(LIGHT_FILL, SMALL_FILL, zp));
    p.setAttribute('stroke-width', cut || t >= T_FOLD ? 0 : 2 / s);
  });
};

window.ready = (async () => {
  await build();
  const fixed = new URLSearchParams(location.search).get('t');
  if (fixed !== null) setTime(parseFloat(fixed));
  else { const t0 = performance.now(); const loop = (now) => { setTime((now - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
