<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stories post</title>
<!--
  Instagram-stories post, 1080x1350, for the client's channel.
  Background #060606; four stories in the order of her Figma (node 53:203). Layout from Figma "tg 7" (node 442:4065): story 540x976.5 at (270,187),
  header geometry taken 1:1 from the frame. Stories are her own 960x1736
  renders (1.778x of the frame); on 1, 3 and 5 their baked-in text was removed
  (src/story-lines-v2/*-clean.webp, see split_text.py) and the copy is set live
  in PP Right Grotesk Bold to her spec, so each line can rise and fade in.
  Story 1 positions are the Figma frame's; 3 and 5 keep the text block's
  centre from her renders.
  ?t=SECONDS freezes the frame at that time (used by render.js);
  without it the page plays in real time on a loop.
-->
<style>
  @font-face { font-family: 'PP Right Grotesk'; src: url('src/PPRightGrotesk-Bold.otf'); font-weight: 700; }
  html, body { margin: 0; background: #060606; }
  .post { position: relative; width: 1080px; height: 1350px; background: #060606; overflow: hidden; }
  .story {
    position: absolute; left: 270px; top: 187px; width: 540px; height: 976.5px;
    border-radius: 16px; overflow: hidden; background: #fff;
  }
  .story__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  /* story text, set live from her Figma (file shbJVIXDZhWJpeWo9QrzrS, node 53:203).
     Her stories are 480px wide there, ours 540px, so every size is x1.125:
     1: title 26/110 +24%, body 26/110 +8%; 3: 86.4/80 +1%; 4: 24/110 +12% */
  .story__text { position: absolute; inset: 0; z-index: 2; }
  .story__line {
    position: absolute; left: 0; width: 100%; margin: 0; text-align: center; white-space: nowrap;
    font-family: 'PP Right Grotesk'; font-weight: 700; opacity: 0; will-change: transform, opacity, filter;
  }
  .story__line { box-sizing: border-box; }
  .t-title { font-size: 29.25px; line-height: 1.1; letter-spacing: .24em; padding-left: .24em; color: #ACB59C; }
  .t-body { font-size: 29.25px; line-height: 1.1; letter-spacing: .08em; padding-left: .08em; color: #17171A; }
  .t-big { font-size: 97.2px; line-height: .8; letter-spacing: .01em; padding-left: .01em; color: #fff; }
  .t-small { font-size: 27px; line-height: 1.1; letter-spacing: .12em; padding-left: .12em; color: #fff; }

  /* stories with a dark top get the white UI, as in her Figma */
  .story.ui-light .bar { background: rgba(255, 255, 255, .4); }
  .story.ui-light .bar__fill { background: #fff; }
  .story.ui-light .meta { color: #fff; }
  .story.ui-light .dots { fill: #fff; }
  .story.ui-light .close { stroke: #fff; }

  .bars, .avatar, .meta, .dots, .close { z-index: 3; }
  .bars { position: absolute; left: 26.33px; top: 22.39px; width: 487.36px; height: 3.95px; display: flex; gap: 4px; }
  .bar { flex: 1; height: 100%; border-radius: 2px; background: rgba(51, 51, 51, .32); overflow: hidden; }
  .bar__fill { height: 100%; width: 100%; background: #333; transform-origin: 0 50%; transform: scaleX(0); }

  .avatar { position: absolute; left: 26.33px; top: 39.51px; width: 39.515px; height: 39.515px; }
  .meta {
    position: absolute; left: 79.01px; top: 44.78px; display: flex; gap: 14.61px;
    font-family: 'Inter', sans-serif; font-size: 20.27px; line-height: 29px;
    letter-spacing: -0.55px; color: #333; white-space: nowrap;
  }
  .meta__name { font-weight: 500; }
  .meta__time { font-weight: 400; }
  .dots { position: absolute; left: 420.19px; top: 56.64px; width: 28.77px; height: 6.11px; }
  .close { position: absolute; left: 475.49px; top: 44.78px; width: 28.99px; height: 26.34px; overflow: visible; }
</style>
</head>
<body>
<div class="post">
  <div class="story">
    <img class="story__img" src="src/story-lines-v2/1-clean.webp" alt="" />
    <img class="story__img" src="src/2.webp" alt="" />
    <img class="story__img" src="src/story-lines-v2/3-clean.webp" alt="" />
    <img class="story__img" src="src/story-lines-v2/5-clean.webp" alt="" />

    <div class="story__text">
      <p class="story__line t-title" style="top:793.125px">Suede sneakers</p>
      <p class="story__line t-body" style="top:839.25px">The ribbed construction</p>
      <p class="story__line t-body" style="top:871.425px">and dual-insole system</p>
    </div>
    <div class="story__text"></div>
    <div class="story__text" data-ui="light">
      <p class="story__line t-big" style="top:742.5px">Summer</p>
      <p class="story__line t-big" style="top:820.26px">collection</p>
    </div>
    <div class="story__text" data-ui="light">
      <p class="story__line t-small" style="top:810px">Delicate color palette,</p>
      <p class="story__line t-small" style="top:839.7px">fluid lines, and a refined</p>
      <p class="story__line t-small" style="top:869.4px">silhouette</p>
    </div>

    <div class="bars"></div>
    <img class="avatar" src="src/logo.png" alt="" />
    <div class="meta"><span class="meta__name">basarab</span><span class="meta__time">12ч.</span></div>
    <svg class="dots" viewBox="0 0 28.77 6.11" fill="#333">
      <circle cx="3.055" cy="3.055" r="3.055" /><circle cx="14.385" cy="3.055" r="3.055" /><circle cx="25.715" cy="3.055" r="3.055" />
    </svg>
    <svg class="close" viewBox="0 0 28.99 26.34" stroke="#333" stroke-width="2.6" stroke-linecap="butt">
      <line x1="1.3" y1="0.6" x2="27.7" y2="25.74" /><line x1="27.7" y1="0.6" x2="1.3" y2="25.74" />
    </svg>
  </div>
</div>
<script>
  const PER = 2.4;         // seconds per story
  // each line rises, sharpens and fades in after the switch, one after another
  const TEXT_AT = 0.12, TEXT_STEP = 0.12, TEXT_DUR = 0.75, TEXT_RISE = 28, TEXT_BLUR = 6;
  const easeOut = (x) => (x = Math.max(0, Math.min(1, x)), 1 - Math.pow(1 - x, 3));
  const imgs = [...document.querySelectorAll('.story__img')];
  const N = imgs.length;
  const textBlocks = [...document.querySelectorAll('.story__text')];
  const texts = textBlocks.map((d) => [...d.children]);
  const lightUi = textBlocks.map((d) => d.dataset.ui === 'light');
  const story = document.querySelector('.story');
  const bars = document.querySelector('.bars');
  const fills = imgs.map(() => {
    const b = document.createElement('div'); b.className = 'bar';
    const f = document.createElement('div'); f.className = 'bar__fill';
    b.appendChild(f); bars.appendChild(b); return f;
  });
  window.DURATION = PER * N;

  window.setTime = (t) => {
    t = ((t % DURATION) + DURATION) % DURATION;
    const cur = Math.min(N - 1, Math.floor(t / PER));
    const p = (t - cur * PER) / PER;
    // hard cut, as Instagram auto-advances within one account
    imgs.forEach((im, i) => im.style.opacity = i === cur ? 1 : 0);
    story.classList.toggle('ui-light', lightUi[cur]);
    const u = t - cur * PER;
    texts.forEach((lines, i) => lines.forEach((l, j) => {
      const e = i === cur ? easeOut((u - TEXT_AT - j * TEXT_STEP) / TEXT_DUR) : 0;
      l.style.opacity = e;
      l.style.transform = `translateY(${(1 - e) * TEXT_RISE}px)`;
      l.style.filter = e < 1 ? `blur(${(1 - e) * TEXT_BLUR}px)` : 'none';
    }));
    fills.forEach((f, i) => f.style.transform = `scaleX(${i < cur ? 1 : i === cur ? p : 0})`);
  };

  const fixed = new URLSearchParams(location.search).get('t');
  if (fixed !== null) setTime(parseFloat(fixed));
  else { const t0 = performance.now(); const loop = (now) => { setTime((now - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
