<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foundation citylight</title>
<style>
  html, body { margin: 0; background: #1a1a1a; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }

  /* The static street photo (1493x2000); the screen is positioned in % of it,
     so the whole thing scales with its width. */
  .citylight {
    position: relative;
    width: min(620px, 100%);
    aspect-ratio: 1493 / 2000;
    background: url(src/mockup.webp) center / 100% 100% no-repeat;
    overflow: hidden;
  }

  /* Flat panel inside the frame's bevel, measured on the photo: x 464-1023, y 536-1535. */
  .citylight__screen {
    position: absolute;
    left: calc(464 / 1493 * 100%);
    top: calc(536 / 2000 * 100%);
    width: calc(559 / 1493 * 100%);
    height: calc(999 / 2000 * 100%);
    overflow: hidden;
  }

  /* Posters stacked in a strip (1, 2, 1). It starts on the bottom copy and slides
     down one poster at a time, so each new banner comes in from above, like a
     roll inside the box; the last frame matches the first, so the loop is seamless. */
  .citylight__strip {
    position: absolute; left: 0; top: 0; width: 100%; height: 300%;
    will-change: transform;
    animation: citylight-scroll 7.4s infinite;
  }
  .citylight__strip img {
    display: block; width: 100%; height: calc(100% / 3);
    object-fit: cover;
    opacity: .9; /* lets the dark panel of the photo through, so the poster sits in the box */
  }
  /* Each banner holds 2.7s, then a 1s slide (pace from the client's reference clip);
     two banners per 7.4s cycle. */
  @keyframes citylight-scroll {
    0%, 36.49%   { transform: translateY(-66.6667%); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    50%, 86.49%  { transform: translateY(-33.3333%); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    100%         { transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .citylight__strip { animation: none; }
  }
</style>
</head>
<body>

<div class="citylight" role="img" aria-label="Citylight with Foundation lecture posters">
  <div class="citylight__screen">
    <div class="citylight__strip">
      <img src="src/poster-1.webp" alt="" />
      <img src="src/poster-2.webp" alt="" />
      <img src="src/poster-1.webp" alt="" />
    </div>
  </div>
</div>

</body>
</html>
