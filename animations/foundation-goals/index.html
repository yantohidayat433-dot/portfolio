<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foundation goals — scroll</title>
<style>
  @font-face { font-family: 'PP Fragment Glare'; src: url(src/fonts/PPFragment-GlareRegular.otf) format('opentype'); font-display: swap; }
  @font-face { font-family: 'PP Fragment Sans'; src: url(src/fonts/PPFragment-SansMedium.otf) format('opentype'); font-display: swap; }

  html, body { margin: 0; background: #1a1a1a; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }

  /* ---------- Frame: 1015x620; warm near-black (was #0E0E0E) to sit with the cards ---------- */
  .goals-scroller {
    --gutter: 24px;
    --gap: 14px;
    position: relative;
    width: min(1015px, 100%);
    aspect-ratio: 1015 / 620;
    background: #110B08;
    overflow: hidden;
  }
  .goals-scroller__track {
    position: absolute;
    inset: var(--gutter) var(--gutter) auto;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    will-change: transform;
  }

  /* ---------- Card: laid out in Figma's own 1376x680 px space, scaled to fit ---------- */
  .goal { position: relative; width: 100%; aspect-ratio: 1376 / 680; }
  .goal__stage {
    position: absolute; left: 0; top: 0;
    width: 1376px; height: 680px;
    transform: scale(var(--s, 1)); transform-origin: 0 0;
    border-radius: 16px; overflow: hidden;
    background: #0B0401;
    color: #fff;
    font-family: 'PP Fragment Sans', sans-serif;
  }
  .goal__stage * { position: absolute; margin: 0; }
  .goal__stage img { max-width: none; pointer-events: none; }

  /* Photo-to-dark falloff: per-card ramps (inline) sampled from the approved card renders. */
  .goal__shade { left: 0; top: -100px; width: 1400px; height: 880px; }

  /* Soft black from the left edge so the big number reads against the photo. */
  .goal__shade-left { left: 0; top: 0; width: 600px; height: 680px; background: linear-gradient(to right, rgba(11,4,1,var(--left-dark, 1)) 0, rgba(11,4,1,0) var(--left-w, 200px)); }

  .goal__glow { display: flex; align-items: center; justify-content: center; }
  .goal__glow img { position: relative; object-fit: cover; }
  .goal__glow--top { left: calc(50% + 496.04px); top: -1400px; opacity: .6; width: 1896.082px; height: 1896.083px; transform: translateX(-50%); }
  .goal__glow--top img { width: 1634.62px; height: 1634.62px; transform: scaleY(-1); }
  .goal__glow--bottom { left: calc(50% - 1057px); top: 130px; opacity: .6; width: 1582px; height: 1582px; transform: translateX(-50%); }
  .goal__glow--bottom img { width: 1582px; height: 1582px; transform: rotate(-90deg) scaleY(-1); }

  .goal__photo { overflow: hidden; }
  .goal__photo img { inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .goal__label, .goal__tab span {
    font-size: 12px; line-height: 1.2; letter-spacing: .24px; text-transform: uppercase; white-space: nowrap;
  }
  .goal__label { left: 49px; top: 32px; }
  .goal__dot { left: 33px; top: 35px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .goal__arrow { top: 35px; width: 48px; height: 48px; }
  .goal__arrow--prev { left: 1232px; transform: scaleX(-1); }
  .goal__arrow--next { left: 1292px; }
  .goal__rule { left: 32px; top: 219px; width: 1308px; height: 1px; background: rgba(217,217,217,.25); }

  .goal__num, .goal__title { top: 245px; font-family: 'PP Fragment Glare', serif; font-weight: 400; line-height: 1.05; }
  .goal__num { left: 33px; font-size: 72px; }
  .goal__title { left: 691px; font-size: 48px; }

  /* Masked line reveal: each line slides up out of its own clip box. */
  .goal__line { position: relative !important; display: block; overflow: hidden; padding-bottom: .14em; margin-bottom: -.14em; }
  .goal__line > span { position: relative !important; display: block; transform: translateY(110%); transition: transform .8s cubic-bezier(.22,1,.36,1); transition-delay: calc(var(--i, 0) * 70ms); }
  .goal.is-active .goal__line > span { transform: none; }

  /* Tabs */
  /* Lighting a tab is a plain colour transition on the tab itself: an opacity-animated
     overlay inside the backdrop-blurred box made Chrome paint the fill in patches. */
  .goal__tab {
    top: 603px; width: 323.5px; height: 49px; border-radius: 8px;
    background-color: rgba(255,255,255,.25);
    -webkit-backdrop-filter: blur(22.3px); backdrop-filter: blur(22.3px);
    transition: background-color .45s ease-out;
  }
  .goal__tab span { top: 17px; color: #fff; transition: color .45s ease-out; }
  .goal__tab span:first-child { left: 20px; }
  .goal__tab span:nth-child(2) { right: 20px; }
  .goal__tab.is-on { background-color: #fff; transition: background-color .5s cubic-bezier(.25,.1,.25,1); }
  .goal__tab.is-on span { color: #121212; transition: color .5s cubic-bezier(.25,.1,.25,1); }

  /* Darkness over cards still on their way up; JS drives its opacity from position. */
  .goal__veil { inset: 0; background: #0B0401; opacity: 0; pointer-events: none; }
  .goal + .goal .goal__veil { opacity: .88; }

  .goal.no-anim * { transition: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .goal__line > span { transform: none; }
  }
</style>
</head>
<body>

<div class="goals-scroller" data-goals-scroller>
  <div class="goals-scroller__track">

    <div class="goal" data-goal="0">
      <div class="goal__stage">

        <div class="goal__shade" style="background:linear-gradient(to right, rgba(11,4,1,0) 496px, rgba(11,4,1,0.048) 508px, rgba(11,4,1,0.096) 520px, rgba(11,4,1,0.143) 532px, rgba(11,4,1,0.19) 544px, rgba(11,4,1,0.237) 556px, rgba(11,4,1,0.284) 568px, rgba(11,4,1,0.329) 580px, rgba(11,4,1,0.372) 592px, rgba(11,4,1,0.415) 604px, rgba(11,4,1,0.459) 616px, rgba(11,4,1,0.509) 628px, rgba(11,4,1,0.559) 640px, rgba(11,4,1,0.606) 652px, rgba(11,4,1,0.655) 664px, rgba(11,4,1,0.704) 676px, rgba(11,4,1,0.749) 688px, rgba(11,4,1,0.79) 700px, rgba(11,4,1,0.844) 712px, rgba(11,4,1,0.898) 724px, rgba(11,4,1,0.944) 736px, rgba(11,4,1,1) 748px)"></div>
        <div class="goal__shade-left"></div>
        <div class="goal__glow goal__glow--top"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__glow goal__glow--bottom"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__ui"></div>
      </div>
    </div>

    <div class="goal" data-goal="1">
      <div class="goal__stage">
        <div class="goal__photo" style="left:-70px;top:-65px;width:806px;height:806px"><img src="src/c2-photo.webp" alt="" /></div>
        <div class="goal__shade" style="background:linear-gradient(to right, rgba(11,4,1,0) 556px, rgba(11,4,1,0.068) 568px, rgba(11,4,1,0.14) 580px, rgba(11,4,1,0.214) 592px, rgba(11,4,1,0.286) 604px, rgba(11,4,1,0.356) 616px, rgba(11,4,1,0.417) 628px, rgba(11,4,1,0.479) 640px, rgba(11,4,1,0.554) 652px, rgba(11,4,1,0.631) 664px, rgba(11,4,1,0.698) 676px, rgba(11,4,1,0.775) 688px, rgba(11,4,1,0.85) 700px, rgba(11,4,1,0.922) 712px, rgba(11,4,1,0.951) 724px, rgba(11,4,1,1) 728px)"></div>
        <div class="goal__shade-left"></div>
        <div class="goal__glow goal__glow--top"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__glow goal__glow--bottom"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__ui"></div>
      </div>
    </div>

    <div class="goal" data-goal="2">
      <div class="goal__stage">
        <div class="goal__photo" style="left:-10px;top:-24px;width:877px;height:877px"><img src="src/c3-photo.webp" alt="" /></div>
        <div class="goal__shade" style="background:linear-gradient(to right, rgba(11,4,1,0) 512px, rgba(11,4,1,0.056) 524px, rgba(11,4,1,0.136) 536px, rgba(11,4,1,0.216) 548px, rgba(11,4,1,0.292) 560px, rgba(11,4,1,0.367) 572px, rgba(11,4,1,0.442) 584px, rgba(11,4,1,0.516) 596px, rgba(11,4,1,0.592) 608px, rgba(11,4,1,0.668) 620px, rgba(11,4,1,0.742) 632px, rgba(11,4,1,0.825) 644px, rgba(11,4,1,0.902) 656px, rgba(11,4,1,0.952) 668px, rgba(11,4,1,1) 672px)"></div>
        <div class="goal__shade-left"></div>
        <div class="goal__glow goal__glow--top"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__glow goal__glow--bottom"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__ui"></div>
      </div>
    </div>

    <div class="goal" data-goal="3">
      <div class="goal__stage">
        <div class="goal__photo" style="left:-22px;top:-121px;width:843px;height:881px"><img src="src/c4-photo.webp" alt="" /></div>
        <div class="goal__shade" style="background:linear-gradient(to right, rgba(11,4,1,0) 380px, rgba(11,4,1,0.042) 392px, rgba(11,4,1,0.077) 404px, rgba(11,4,1,0.112) 416px, rgba(11,4,1,0.145) 428px, rgba(11,4,1,0.177) 440px, rgba(11,4,1,0.212) 452px, rgba(11,4,1,0.245) 464px, rgba(11,4,1,0.281) 476px, rgba(11,4,1,0.316) 488px, rgba(11,4,1,0.348) 500px, rgba(11,4,1,0.382) 512px, rgba(11,4,1,0.41) 524px, rgba(11,4,1,0.441) 536px, rgba(11,4,1,0.479) 548px, rgba(11,4,1,0.519) 560px, rgba(11,4,1,0.56) 572px, rgba(11,4,1,0.598) 584px, rgba(11,4,1,0.634) 596px, rgba(11,4,1,0.669) 608px, rgba(11,4,1,0.704) 620px, rgba(11,4,1,0.737) 632px, rgba(11,4,1,0.771) 644px, rgba(11,4,1,0.806) 656px, rgba(11,4,1,0.841) 668px, rgba(11,4,1,0.875) 680px, rgba(11,4,1,0.91) 692px, rgba(11,4,1,0.941) 704px, rgba(11,4,1,0.964) 716px, rgba(11,4,1,0.985) 724px, rgba(11,4,1,1) 744px)"></div>
        <div class="goal__shade-left"></div>
        <div class="goal__glow goal__glow--top"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__glow goal__glow--bottom"><img src="src/glow.webp" alt="" /></div>
        <div class="goal__ui"></div>
      </div>
    </div>

  </div>
</div>

<template id="goal-ui">
  <span class="goal__dot"></span>
  <p class="goal__label">The goals of the foundation</p>
  <img class="goal__arrow goal__arrow--prev" src="src/arrow.svg" alt="" />
  <img class="goal__arrow goal__arrow--next" src="src/arrow.svg" alt="" />
  <span class="goal__rule"></span>
  <p class="goal__num"></p>
  <p class="goal__title"></p>
  <div class="goal__tab" style="left:28px"><span>Popularization of science</span><span>01</span></div>
  <div class="goal__tab" style="left:359.5px"><span>Creation of an expert community</span><span>02</span></div>
  <div class="goal__tab" style="left:691px"><span>The mechanism of interaction</span><span>03</span></div>
  <div class="goal__tab" style="left:1022.5px"><span>International dialogue</span><span>04</span></div>
</template>

<script>
(function () {
  var TITLES = [
    ['To make scientific activity', 'in demand and prestigious,', 'to form a new perception'],
    ['Building an expert', 'community in emerging', 'technologies'],
    ['Establishing a mechanism', 'for interaction between', 'science and business'],
    ['Maintaining a sustained', 'international scientific', 'dialogue']
  ];
  var HOLD = 2000;      // ms each card rests at the top
  var MOVE = 900;       // ms of travel between cards
  var ACTIVATE_AT = .7; // fraction of the travel at which the arriving card lights up
  var MAX_DARK = .88;   // veil opacity on the card peeking in at the bottom

  // CSS-style cubic-bezier(x1, y1, x2, y2) as a function of t (Newton steps, then bisection).
  function bezier(x1, y1, x2, y2) {
    function at(a, b, t) { return ((1 - 3 * b + 3 * a) * t + (3 * b - 6 * a)) * t * t + 3 * a * t; }
    function slope(a, b, t) { return 3 * (1 - 3 * b + 3 * a) * t * t + 2 * (3 * b - 6 * a) * t + 3 * a; }
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      var t = x;
      for (var i = 0; i < 6; i++) { var d = slope(x1, x2, t); if (Math.abs(d) < 1e-6) break; t -= (at(x1, x2, t) - x) / d; }
      if (t < 0 || t > 1 || Math.abs(at(x1, x2, t) - x) > 1e-4) {
        var lo = 0, hi = 1; t = x;
        for (var j = 0; j < 30; j++) { if (at(x1, x2, t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      }
      return at(y1, y2, t);
    };
  }
  // Soft in-out: eases off the mark and settles gently, without a rush in the middle.
  var ease = bezier(.45, 0, .15, 1);
  function line(text, i) { return '<span class="goal__line"><span style="--i:' + i + '">' + text + '</span></span>'; }

  var tpl = document.getElementById('goal-ui');

  document.querySelectorAll('[data-goals-scroller]').forEach(function (root) {
    var track = root.querySelector('.goals-scroller__track');
    var originals = Array.prototype.slice.call(track.children);
    var count = originals.length;

    originals.forEach(function (card, k) {
      var ui = card.querySelector('.goal__ui');
      ui.replaceWith(tpl.content.cloneNode(true));
      var veil = document.createElement('div');
      veil.className = 'goal__veil';
      card.querySelector('.goal__stage').appendChild(veil);
      card.querySelector('.goal__num').innerHTML = line('0' + (k + 1), 0);
      card.querySelector('.goal__title').innerHTML = TITLES[k].map(function (t, i) { return line(t, i + 1); }).join('');
    });
    // Clone the set once so the loop wraps seamlessly from card 4 back to card 1.
    originals.forEach(function (card) { track.appendChild(card.cloneNode(true)); });
    var cards = Array.prototype.slice.call(track.children);
    var veils = cards.map(function (c) { return c.querySelector('.goal__veil'); });

    function fit() {
      var s = cards[0].getBoundingClientRect().width / 1376;
      cards.forEach(function (c) { c.querySelector('.goal__stage').style.setProperty('--s', s); });
    }
    fit();
    window.addEventListener('resize', fit);

    // Both copies of a logical card always share the same state.
    function copies(k) { return cards.filter(function (c) { return +c.dataset.goal === k; }); }

    // "Waiting" state: no tab lit, text hidden.
    function prime(k) {
      copies(k).forEach(function (c) {
        c.classList.add('no-anim');
        c.classList.remove('is-active');
        var tabs = c.querySelectorAll('.goal__tab');
        tabs.forEach(function (t) { t.classList.remove('is-on'); });
        void c.offsetWidth;
        c.classList.remove('no-anim');
      });
    }
    function activate(k) {
      // The card that is leaving (scrolled up / covered) lets its tab go dark.
      var prev = (k + count - 1) % count;
      copies(prev).forEach(function (c) { c.querySelectorAll('.goal__tab')[prev].classList.remove('is-on'); });
      copies(k).forEach(function (c) {
        var tabs = c.querySelectorAll('.goal__tab');
        tabs[k].classList.add('is-on');
        c.classList.add('is-active');
      });
    }

    for (var k = 0; k < count; k++) prime(k);

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { activate(0); return; }

    var visible = true, start = null, paused = 0, pauseAt = null, current = -1;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(root);
    }

    function frame(now) {
      if (!visible) { if (pauseAt === null) pauseAt = now; requestAnimationFrame(frame); return; }
      if (pauseAt !== null) { paused += now - pauseAt; pauseAt = null; }
      if (start === null) start = now;

      var cycle = HOLD + MOVE;
      var t = (now - start - paused) % (cycle * count);
      var step = Math.floor(t / cycle);
      var local = t - step * cycle;
      var raw = local < HOLD ? 0 : (local - HOLD) / MOVE;
      var p = ease(raw);
      var from = cards[step].offsetTop, to = cards[step + 1].offsetTop;
      var offset = from + (to - from) * p;
      track.style.transform = 'translate3d(0,' + (-offset) + 'px,0)';

      // A card is fully dark one slot below the top and clears as it rises into place.
      var slot = to - from;
      veils.forEach(function (v, i) {
        var d = Math.min(Math.max((cards[i].offsetTop - offset) / slot, 0), 1);
        v.style.opacity = (MAX_DARK * Math.pow(d, .7)).toFixed(3);
      });

      var now_k = (raw >= ACTIVATE_AT ? step + 1 : step) % count;
      if (now_k !== current) {
        current = now_k;
        activate(current);
        prime((current + 2) % count); // off-screen by now: reset it for its next arrival
      }
      requestAnimationFrame(frame);
    }
    // Short beat before the first card lights up.
    setTimeout(function () { requestAnimationFrame(frame); }, 400);
  });
})();
</script>
</body>
</html>
